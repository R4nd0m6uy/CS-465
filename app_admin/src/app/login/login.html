<div class="row justify-content-center">
  <div class="col-md-5">
    <h1>Admin Login</h1>

    <div *ngIf="message" class="alert alert-danger">
      {{ message }}
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="card card-body">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          class="form-control"
          type="email"
          name="email"
          [(ngModel)]="credentials.email"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          class="form-control"
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          required>
      </div>

      <button class="btn btn-primary" type="submit" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>
  </div>
</div>
