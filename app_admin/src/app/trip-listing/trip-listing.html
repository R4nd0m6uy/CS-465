<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Trip Listing</h1>
  <a class="btn btn-primary" routerLink="/add-trip">Add Trip</a>
</div>

<div *ngIf="message" class="alert alert-danger">
  {{ message }}
</div>

<div *ngIf="!message && trips.length === 0" class="alert alert-warning">
  No trips loaded yet.
</div>

<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let trip of trips">
    <app-trip-card
      [trip]="trip"
      (deleteRequested)="deleteTrip($event)">
    </app-trip-card>
  </div>
</div>
